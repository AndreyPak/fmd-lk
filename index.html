function currentDay(){

function tasksFor(d){
  const L = [];
  if (d.stage==='fmd'){
    L.push({g:'Утро', items:D.basePractices.morning.concat(d.morning ? [d.morning] : [])});
    L.push({g:'В течение дня', items:D.basePractices.day});
    L.push({g:'Вечер', items:[d.evening].concat(d.extraTask ? [d.extraTask] : []).concat(D.basePractices.evening)});
  } else if (d.stage==='exit'){
    const it = ['Утром — овощной смузи, ⅓ стакана', '3 приёма пищи без перекусов', 'Прогулка натощак', '1,5–2 л воды'];
    if (d.measure) it.unshift('Записать вес и объёмы в «Прогресс»');
    if (d.calc) it.push('Сделать биоимпеданс и рассчитать персональный калораж');
    if (d.lifeAfter) it.push('Прочитать «Как жить дальше» и сохранить методичку');
    L.push({g:'Задачи дня', items:it});
  } else {
    L.push({g:'Задачи дня', items:d.tasks});
  }
  return L;
}
function checklist(d){
  const groups = tasksFor(d); let total=0, done=0;
  const html = groups.map((g,gi) => `<div class="group-h">${esc(g.g)}</div>` + g.items.map((t,i) => {
    const id = `d${d.n}_${gi}_${i}`; total++; if (checks[id]) done++;
    return `<div class="task"><label><input type="checkbox" id="${id}" data-ck="${id}" ${checks[id]?'checked':''}><span>${esc(t)}</span></label>${taskLink(t)}</div>`;
  }).join('')).join('');
  return {html, total, done};
}

function taskLink(t){

  if (to.startsWith('pdf:')) return `<a class="tlink" href="files/${to.slice(4)}.pdf" target="_blank" rel="noopener">${label} ↗</a>`;

  let h = `<div class="dayhead"><span class="eyebrow">Покупки</span><h1>Что купить к программе</h1><p class="goal">Отмечайте купленное — список сохранится на этом устройстве.</p></div>`;
  h += `<div class="section" id="sec-kit"><h2>Набор к старту</h2><p class="muted">Часть пригодится уже в первый день подготовки. Всё есть в эко-магазинах.</p><div class="card check">`;
  D.kit.forEach((k,i)=>{ const id='kit_'+i;
    h += `<label><input type="checkbox" id="${id}" data-ck="${id}" ${checks[id]?'checked':''}><span>${esc(k.t)}<small>${esc(k.d)}${k.url?` · <a href="${esc(k.url)}" target="_blank" rel="noopener">пример</a>`:''}</small>${k.flag?`<small class="flag">⚠ ${esc(k.flag)}</small>`:''}</span></label>`; });
  h += `</div></div>`;
  h += `<div class="section" id="sec-shopping"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>Продукты на 5 дней FMD</h2><a href="files/pokupki-fmd.pdf" target="_blank" rel="noopener">PDF</a></div><p class="muted">Закупиться лучше на 6-й день подготовки.</p><div class="card check">`;
  D.shopping.forEach((g,gi)=>{ h += `<div class="group-h">${esc(g.g)}</div>` + g.i.map((t,i)=>{const id=`shop_${gi}_${i}`;return `<label><input type="checkbox" id="${id}" data-ck="${id}" ${checks[id]?'checked':''}><span>${esc(t)}</span></label>`}).join(''); });
  h += `</div></div>`;
  return h;
}
function vLibrary(){
  let h = `<div class="dayhead"><span class="eyebrow">Материалы</span><h1>Гиды, меню и рецепты</h1><p class="goal">Подарки и методички Виктории. Открываются в новой вкладке, их можно сохранить.</p></div>`;
  D.library.forEach((g,gi) => {
    h += `<div class="section" id="lib-${gi}"><h2>${esc(g.g)}</h2><div class="lib">` + g.items.map(it => {
      const inner = (cv, cls) => `<div class="cv ${cls||''}" ${cv?`style="background-image:url('${cv}')"`:''}>${cls==='icon'?(it.video?'▶':'↗'):''}</div><div class="t"><b>${esc(it.t)}</b><small>${esc(it.d)}</small>${it.flag?`<span class="tag">⚠ ${esc(it.flag)}</span>`:''}</div>`;
      if (it.f) return `<a class="doc" href="files/${it.f}.pdf" target="_blank" rel="noopener">${inner('img/cover-'+it.f+'.jpg')}</a>`;
      if (it.img) return `<button class="doc" data-img="${it.img}">${inner('img/'+it.img+'.jpg')}</button>`;
      if (it.video || it.drive) return `<a class="doc" href="${esc(it.video||it.drive)}" target="_blank" rel="noopener">${inner('', 'icon')}</a>`;
      return `<div class="doc missing">${inner('', 'icon')}</div>`;
    }).join('') + `</div></div>`;
  });
  return h;
}
const POINTS = [['start','Старт','перед подготовкой'],['fmd0','Перед FMD','утро дня 8'],['fmd5','После FMD','утро выхода, день 13'],['finish','Финиш','день 19']];
const FIELDS = [['w','Вес, кг'],['waist','Талия, см'],['hips','Бёдра, см']];
function syncBanner(){
  const M = {
    ok: ['', 'Замеры и отметки сохраняются в вашем кабинете — они видны с любого устройства по вашей личной ссылке.'],
    loading: ['', 'Загружаем ваши данные…'],
    local: ['warn', 'Данные сохраняются только на этом устройстве. Чтобы история не потерялась, откройте кабинет по личной ссылке из WhatsApp.'],
    badkey: ['warn', 'Личная ссылка устарела. Попросите новую ссылку в WhatsApp — пока данные сохраняются только на этом устройстве.'],
    noaccess: ['warn', 'Доступ к программе не найден. Напишите нам в WhatsApp.'],
    offline: ['warn', 'Нет связи с сервером — данные временно сохраняются на этом устройстве.']
  }[sync];
  return `<div class="section"><div class="sync ${M[0]}">${M[0]?'⚠':'✓'} <span>${M[1]}</span></div></div>`;
}
function weightChart(){
  const pts = POINTS.map((p,i) => ({i, l:p[1], v: parseFloat(String((meas[p[0]]||{}).w||'').replace(',','.'))})).filter(x => !isNaN(x.v));
  if (pts.length < 2) return '';
  const W=320, H=150, px=34, py=26, vs=pts.map(p=>p.v), mn=Math.min(...vs)-1, mx=Math.max(...vs)+1;
  const X = i => px + i*(W-2*px)/3, Y = v => py + (mx-v)*(H-2*py)/(mx-mn);
  const line = pts.map((p,k)=>(k?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${X(pts[pts.length-1].i).toFixed(1)} ${H-py} L${X(pts[0].i).toFixed(1)} ${H-py} Z`;
  const fmt = v => v.toFixed(1).replace('.',',');
  return `<div class="section"><h2>Динамика веса</h2><div class="card"><svg class="chart" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="График веса по замерам">
    <line x1="${px}" x2="${W-px}" y1="${H-py}" y2="${H-py}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--fmd-soft)"/>
    <path d="${line}" fill="none" stroke="var(--forest)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,k)=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="${k===pts.length-1?5:3.5}" fill="${k===pts.length-1?'var(--lime)':'var(--forest)'}" stroke="var(--forest)" stroke-width="1.5"/>
      <text x="${X(p.i)}" y="${Y(p.v)-10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${fmt(p.v)}</text>`).join('')}
    ${POINTS.map((p,i)=>`<text x="${X(i)}" y="${H+8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p[1]}</text>`).join('')}
  </svg></div></div>`;
}
function vTracker(){
  const all = D.days.map(checklist); const tot = all.reduce((a,c)=>a+c.total,0), dn = all.reduce((a,c)=>a+c.done,0);
  const num = v => parseFloat(String(v||'').replace(',','.'));
  const ws = POINTS.map(p => num((meas[p[0]]||{}).w)).filter(v=>!isNaN(v));
  const delta = ws.length>1 ? (ws[ws.length-1]-ws[0]) : null;
  let h = `<div class="dayhead"><span class="eyebrow">Прогресс</span><h1>Ваши результаты</h1></div>
   <div class="section stat">
     <div><b>${delta==null?'—':(delta>0?'+':'')+delta.toFixed(1).replace('.',',')}</b><span>кг с начала</span></div>
     <div><b>${cur&&cur>=1?Math.min(cur,19):0}/19</b><span>дней пройдено</span></div>
     <div><b>${tot?Math.round(dn/tot*100):0}%</b><span>задач выполнено</span></div>
   </div>
   ${syncBanner()}
   ${weightChart()}
   <div class="section" id="sec-meas"><h2>Вес и объёмы</h2><p class="muted">Виктория просит фиксировать замеры утром натощак.</p>
   <div class="card" style="overflow-x:auto"><table class="meas"><thead><tr><th>Замер</th>${FIELDS.map(f=>`<th>${f[1]}</th>`).join('')}</tr></thead><tbody>`;
  POINTS.forEach(p => { const on = (meas[p[0]]||{}).on; h += `<tr><td><b>${p[1]}</b><br><small class="muted">${p[2]}</small>${on?`<small class="on">записано ${new Date(on+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</small>`:''}</td>` + FIELDS.map(f => `<td><input class="ym-disable-keys" inputmode="decimal" id="m_${p[0]}_${f[0]}" data-m="${p[0]}" data-f="${f[0]}" value="${esc((meas[p[0]]||{})[f[0]]||'')}" aria-label="${p[1]}: ${f[1]}"></td>`).join('') + `</tr>`; });
  h += `</tbody></table></div></div>
   <div class="section"><h2>Поддержка</h2><div class="card stack"><p>Вопросы по питанию, самочувствию и замене продуктов — в WhatsApp.</p>
     <div class="row"><a class="btn primary" href="https://wa.me/${D.support.whatsapp}?text=${encodeURIComponent('Здравствуйте! Я участница программы FMD, у меня вопрос:')}" target="_blank" rel="noopener">Написать в WhatsApp</a>
     <a class="btn ghost" href="${D.support.instagram}" target="_blank" rel="noopener">Instagram Виктории</a></div>
     <p class="muted">+${D.support.whatsapp.replace(/(\d)(\d{3})(\d{3})(\d{2})(\d{2})/,'$1 $2 $3 $4 $5')}</p></div></div>`;
  return h;
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false'));
  renderDays();
  const v = {today:vToday, program:vProgram, shop:vShop, library:vLibrary, tracker:vTracker}[tab] || vToday;
  const el = $('#view'); el.innerHTML = v(); el.classList.remove('view'); void el.offsetWidth; el.classList.add('view');
}
function go(t, n, anchor){ const prev = tab + sel; tab=t; if(n) sel=n; try{history.replaceState(null,'','#'+t);}catch(e){} render();
  if (prev !== tab + sel){ ymHit(); if (prev.replace(/\d+$/,'') !== tab) ymGoal('cabinet_tab', {tab}); }
  const el = anchor && document.getElementById(anchor);
  if (!el){ window.scrollTo(0,0); return; }
  const top = el.getBoundingClientRect().top + window.scrollY - $('.top').offsetHeight - 8;
  window.scrollTo({top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  const box = el.querySelector('.card, .lib, .doc') || el; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-tab],[data-day],[data-open],[data-step],[data-go],[data-img],#resetStart,#lb');
  if (!t) return;
  if (t.classList.contains('tlink')) ymGoal('plan_link', {to: t.dataset.nav || t.dataset.img || '', day: sel});
  if (t.id==='lb'){ t.hidden = true; return; }
  if (t.id==='resetStart'){ start=null; store.set('start',null); go('today'); return; }
  if (t.dataset.step) ymGoal('day_step', {dir: t.dataset.step});
  if (t.dataset.nav){ const [tb, an] = t.dataset.nav.split('#'); go(tb, null, an); return; }
  if (t.dataset.tab) go(t.dataset.tab);
  else if (t.dataset.day){ userPicked = true; go('today', +t.dataset.day); }
  else if (t.dataset.open) go('today', +t.dataset.open);
  else if (t.dataset.step) go('today', Math.min(19, Math.max(1, sel + +t.dataset.step)));
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.img){ ymGoal('image_open', {img: t.dataset.img}); $('#lbimg').src='img/'+t.dataset.img+'.jpg'; $('#lb').hidden=false; }
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const href = a.getAttribute('href');
  if (/^files\/.+\.pdf$/.test(href)) ymGoal('material_open', {file: href.slice(6), from: a.classList.contains('tlink') ? 'plan' : tab});
  else if (/wa\.me/.test(href)) ymGoal('whatsapp_click', {from: tab});
  else if (/instagram\.com/.test(href)) ymGoal('instagram_click');
  else if (/youtu/.test(href)) ymGoal('video_open', {from: tab});
  else if (/drive\.google|kaspi|surl/.test(href)) ymGoal('external_open', {href: href.slice(0,80), from: tab});
}, true);
document.addEventListener('toggle', e => { const t = e.target; if (t.dataset && t.dataset.mv && t.open) ymGoal('motivation_archive', {day: +t.dataset.mv}); }, true);
const LIMITS = {w:[30,250,'Вес'], waist:[40,200,'Талия'], hips:[50,220,'Бёдра']};
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ck){ checks[t.dataset.ck] = t.checked; store.set('checks', checks); renderDays();
    ymGoal(t.checked ? 'task_check' : 'task_uncheck', {item: t.dataset.ck, kind: t.dataset.ck.split('_')[0][0]==='d' ? 'plan' : t.dataset.ck.split('_')[0]});
    if (sync==='ok') api('check', {item: t.dataset.ck, checked: t.checked}).then(j => { if (j.error) toast('Отметка не сохранилась'); }).catch(() => toast('Нет связи — отметка сохранится только на этом устройстве'));
    if (tab==='today'){ const c = checklist(dayObj(sel)); const p=document.querySelector('.progress i'); if(p) p.style.width=(c.total?Math.round(c.done/c.total*100):0)+'%'; const m=p&&p.closest('.section').querySelector('.muted'); if(m) m.textContent=c.done+' из '+c.total; } }
  if (t.dataset.m){
    const pt = t.dataset.m, f = t.dataset.f, v = t.value.trim().replace(',', '.');
    const lim = LIMITS[f]; const n = parseFloat(v);
    if (v && (isNaN(n) || n < lim[0] || n > lim[1])){ ymGoal('measure_invalid', {field: f}); t.classList.add('bad'); toast(`${lim[2]}: введите число от ${lim[0]} до ${lim[1]}`); return; }
    t.classList.remove('bad');
    meas[pt] = meas[pt] || {}; meas[pt][f] = v; store.set('meas', meas);
    if (sync==='ok'){
      const m = meas[pt];
      api('measure', {point: pt, weight: m.w||'', waist: m.waist||'', hips: m.hips||''})
        .then(j => { if (j.error){ toast('Не сохранилось: проверьте значения'); return; } m.on = new Date().toISOString().slice(0,10); store.set('meas', meas); toast('Сохранено'); ymGoal('measure_save', {point: pt, field: f}); if (tab==='tracker') render(); })
        .catch(() => toast('Нет связи — замер сохранён только на этом устройстве'));
    } else { render(); ymGoal('measure_save_local', {point: pt, field: f}); }
  }
});
document.addEventListener('submit', e => {
  if (e.target.id==='startForm'){ e.preventDefault(); const v=$('#startDate').value; if(!v) return; start=v; store.set('start',v); ymGoal('start_date_set');
    cur=currentDay(); sel=(cur>=1&&cur<=19)?cur:1; render(); }
});
async function syncLoad(){
  try{
    const j = await api('get');
    if (j.error){ sync = j.error==='no_access' ? 'noaccess' : 'badkey'; render(); return; }
    me = j; sync = 'ok';
    try{ if (window.ym){ ym(YM_ID, 'setUserID', keyId(KEY)); ym(YM_ID, 'userParams', {program: j.program || '', program_id: j.program_id, has_key: true, UserID: keyId(KEY)}); } }catch(e){}
    ymGoal('lk_login', {program_id: j.program_id});
    if (j.start && !qs.get('start')){ start = j.start; store.set('start', start); }
    cur = currentDay(); if (!userPicked) sel = (cur && cur>=1 && cur<=19) ? cur : 1;
    checks = {}; (j.checks||[]).forEach(i => { checks[i] = true; }); store.set('checks', checks);
    meas = {}; Object.entries(j.measures||{}).forEach(([k,v]) => { meas[k] = {w:v.w??'', waist:v.waist??'', hips:v.hips??'', on:v.on}; }); store.set('meas', meas);
    if (j.name){ const first = j.name.trim().split(/\s+/)[0]; $('#subtitle').textContent = first + ' · программа Виктории Репич'; $('.top .ava').textContent = first[0].toUpperCase(); }
    render();
  }catch(e){ sync = 'offline'; render(); ymGoal('sync_error'); }
}
render();
ymGoal('cabinet_open', {has_key: !!KEY});
if (KEY) syncLoad();
})();
</script>
